name = "mountain-inference"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

# Alerting policy — see worker/src/transition.ts and NOTIFICATIONS.md. Tunable
# here so thresholds move without a code change; both are parsed as numbers and
# fall back to the code defaults when unset or unparseable.
[vars]
# Binary confidence (p(out) vs p(not out)) a confirmed change must clear to be
# announced. Below it the frame becomes a label request instead. Measured on
# 2026-07-29/30: 0.85 keeps the 4 trustworthy alerts and suppresses the 4 that
# fired at 0.42–0.71, one of which reversed 30 minutes later.
ALERT_MIN_CONFIDENCE = "0.85"
# Minimum gap between label requests, so a long ambiguous stretch asks once
# rather than every 15 minutes. 4h ≈ 4 asks/day on that same sample.
LABEL_COOLDOWN_HOURS = "4"

# Pipeline-health alerting — see worker/src/health.ts. The */15 tick failed
# 1,637 times in a row between 2026-08-07 and 2026-08-24 (the UW webcam2 image
# 404'd upstream) and said nothing, because the error path only wrote to
# history.jsonl. These two govern the alert that now exists.
#
# Consecutive failed ticks before the outage is announced. 4 = one hour at the
# */15 cadence: past every transient in the history file (container cold start,
# NOAA read timeout, Durable Object reset), well short of a fortnight.
HEALTH_ALERT_AFTER_FAILURES = "4"
# Minimum gap between repeat alerts within one outage, so a long outage nags
# ~4x/day rather than 96x. Recovery is never rate-limited.
HEALTH_REALERT_HOURS = "6"

# Container binding. Cloudflare Containers can only pull from its own managed
# registry (not GHCR), so the image is pushed to registry.cloudflare.com:
#   docker pull ghcr.io/robogeosociety/is-the-mountain-out/inference:latest
#   docker tag  ... mountain-inference:latest
#   wrangler containers push mountain-inference:latest
# See .github/workflows/build-inference-image.yml for the upstream GHCR build.
[[containers]]
class_name = "InferenceContainer"
image = "registry.cloudflare.com/d7adee58513c1b2f770ccaac90cf114f/mountain-inference:28b43b0"
max_instances = 1
instance_type = "standard-1"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InferenceContainer"]

[durable_objects]
bindings = [
  { class_name = "InferenceContainer", name = "INFERENCE_CONTAINER" }
]

# Public bucket the SPA reads from. Worker writes state.json + history.jsonl.
[[r2_buckets]]
binding = "STATE_BUCKET"
bucket_name = "is-the-mountain-out-public"

# Private captures bucket. On a visibility transition the Worker persists the
# announced frame (+ METAR) here under a standard capture key and footers the
# notification with it, so a 👍/⛅/👎 reaction on the notification can become a
# training label (see BOT.md in the repo root).
[[r2_buckets]]
binding = "CAPTURE_BUCKET"
bucket_name = "is-the-mountain-out"

# Web CI — the PR gate for web/ (the public SPA).
#
# Lint, then `npm run build`, which runs `tsc -b` over the app and the vite
# config before vite bundles. Deliberately NOT path-filtered: a path-filtered
# job that never starts shows as "pending" forever once it is a required check.
# It takes about a minute.
#
# publish.yml does its own build on the self-hosted runner rather than calling
# this one — that job needs the dev disk, which a GitHub-hosted runner cannot
# see, so there is nothing to share. `workflow_call` is kept so it can still be
# invoked from elsewhere.
name: Web CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build` — the typecheck is part of the build. This is the
      # same build publish.yml runs; only the state.json staging differs.
      - name: Build
        run: npm run build

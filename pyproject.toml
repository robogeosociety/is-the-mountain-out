[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mountain-trainer"
version = "0.1.0"
description = "Iterative LoRA training for Mount Rainier visibility detection"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "astral>=3.2",
    "boto3>=1.38.0",
    "ipython>=9.0.0",
    "ipywidgets>=8.1.5",
    "nbclassic>=1.2.0",
    "notebook>=7.3.2",
    "matplotlib>=3.10.8",
    "metar>=1.11.0",
    "opencv-python-headless>=4.13.0.92",
    "peft>=0.18.1",
    "playwright>=1.49.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "timm>=1.0.24",
    "tomli>=2.4.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "typer>=0.24.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pillow>=12.1.1",
    "rich>=14.3.3",
]

[project.scripts]
training = "train.scheduler:app"
train-tray = "train.tray:cli"
collect = "collect.collector:cli"
classify = "collect.classifier:cli_wrapper"
bot = "bot.main:cli"

[tool.ruff.lint]
# The rule set is DECLARED, not inherited. Ruff's implicit default is a moving
# target: 0.16.0 widened it from these four families to ~40 (BLE, S, UP, LOG,
# PL, DTZ, RUF…), which surfaced 245 findings in untouched code and turned CI
# red without a single line changing. This pins the gate's meaning; the version
# is pinned separately in .github/workflows/lint.yml.
#
# E4/E7/E9 (import, statement and runtime pycodestyle errors) + F (pyflakes)
# were ruff's default through 0.15.x and are what this codebase has always been
# held to. Widening it is a deliberate, separate change — `ruff check
# --select I,UP --fix` alone rewrites ~90 lines across 32 files, and the
# behavioral families (BLE001 blind-except, S110 try-except-pass) mark
# intentional best-effort error handling that must be reviewed case by case,
# not swept.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
packages = ["train", "collect", "bot"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "tabulate>=0.9.0",
    "tomli-w>=1.2.0",
]
# Discord reaction-labeling bot (BOT.md). A named group — not a main dependency —
# so the inference container's `uv sync --no-dev` never installs it.
# Run with:  uv run --group bot bot run
bot = [
    "discord-py>=2.6",
]

# Inference runs on CPU (Cloudflare Containers; no GPU). On Linux pull the
# CPU-only torch wheels — the default PyPI Linux wheels bundle ~6 GB of CUDA
# libraries that bloat the container image past its disk and slow every cold
# start. macOS keeps the default wheel (MPS) for training via the marker.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
